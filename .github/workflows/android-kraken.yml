name: Kraken Mobile Android

on:
  workflow_dispatch:
  push:
    branches: [ kraken-mobile ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: kraken-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Diagnostic APK (arm64)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Test vegetation collision sweep
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror -Iinclude \
          tests/test_vegetation_sweep.cpp -o /tmp/test-vegetation-sweep
        /tmp/test-vegetation-sweep

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          android/*.gradle
          android/gradle/wrapper/gradle-wrapper.properties
          android/app/*.gradle

    - name: Prepare permanent release signing
      env:
        KRAKEN_KEYSTORE_BASE64: ${{ secrets.KRAKEN_KEYSTORE_BASE64 }}
        KRAKEN_KEYSTORE_PASSWORD: ${{ secrets.KRAKEN_KEYSTORE_PASSWORD }}
        KRAKEN_KEY_ALIAS: ${{ secrets.KRAKEN_KEY_ALIAS }}
        KRAKEN_KEY_PASSWORD: ${{ secrets.KRAKEN_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        missing=0
        for variable in \
          KRAKEN_KEYSTORE_BASE64 \
          KRAKEN_KEYSTORE_PASSWORD \
          KRAKEN_KEY_ALIAS \
          KRAKEN_KEY_PASSWORD; do
          if [ -z "${!variable:-}" ]; then
            echo "::error::Missing required Actions secret: ${variable}"
            missing=1
          fi
        done
        test "${missing}" -eq 0
        printf '%s' "${KRAKEN_KEYSTORE_BASE64}" | \
          base64 --decode > "${RUNNER_TEMP}/kraken-release.jks"
        test -s "${RUNNER_TEMP}/kraken-release.jks"

    - name: Install Android SDK and pinned NDK
      run: |
        yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
          --install "ndk;28.2.13676358" "platforms;android-34" \
                    "build-tools;34.0.0" >/dev/null

    - name: Cache OpenSSL for Android
      id: cache-openssl
      uses: actions/cache@v4
      with:
        path: build-android-deps
        key: kraken-android-openssl-${{ hashFiles('tools/build-android-deps.sh') }}

    - name: Build OpenSSL for arm64
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        tools/build-android-deps.sh arm64-v8a 33

    - name: Build diagnostic APK
      working-directory: android
      env:
        KRAKEN_KEYSTORE_FILE: ${{ runner.temp }}/kraken-release.jks
        KRAKEN_KEYSTORE_PASSWORD: ${{ secrets.KRAKEN_KEYSTORE_PASSWORD }}
        KRAKEN_KEY_ALIAS: ${{ secrets.KRAKEN_KEY_ALIAS }}
        KRAKEN_KEY_PASSWORD: ${{ secrets.KRAKEN_KEY_PASSWORD }}
      run: |
        export ANDROID_NDK_ROOT="${ANDROID_HOME}/ndk/28.2.13676358"
        export KRAKEN_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
        ./gradlew :app:assembleRelease --no-daemon

    - name: Verify required mobile shaders
      run: |
        set -euo pipefail
        APK=android/app/build/outputs/apk/release/app-release.apk
        test -f "${APK}" || APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
        unzip -l "${APK}" > apk-files.txt
        for shader in \
          grass_cull.comp.spv \
          m2_cull_hiz.comp.spv \
          mobile_upscale.frag.spv \
          terrain_mobile.frag.spv \
          world_map_fog.frag.spv; do
          grep -q "assets/assets/shaders/${shader}" apk-files.txt || {
            echo "::error::APK is missing ${shader}"
            exit 1
          }
        done

    - name: Verify permanent APK signature
      run: |
        set -euo pipefail
        APK=android/app/build/outputs/apk/release/app-release.apk
        test -f "${APK}"
        "${ANDROID_HOME}/build-tools/34.0.0/apksigner" \
          verify --verbose --print-certs "${APK}" | tee signing-report.txt

    - name: Prepare APK artifact
      run: |
        APK=android/app/build/outputs/apk/release/app-release.apk
        test -f "${APK}"
        cp "${APK}" "Kraken-Mobile-signed-diagnostic-${GITHUB_RUN_NUMBER}.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Kraken-Mobile-signed-diagnostic-${{ github.run_number }}
        path: |
          Kraken-Mobile-signed-diagnostic-*.apk
          signing-report.txt
        if-no-files-found: error
        retention-days: 14

    - name: Remove temporary signing key
      if: always()
      run: rm -f "${RUNNER_TEMP}/kraken-release.jks"
